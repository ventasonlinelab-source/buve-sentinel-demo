<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><defs><radialGradient id="bg"><stop stop-color="#10201f"/><stop offset="1" stop-color="#070b0b"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Arial,sans-serif;fill:#e7f4ef} .muted{fill:#91a9a2}.line{stroke:#49726a;stroke-width:2;fill:none}.node{fill:#142522;stroke:#6bb5a6;stroke-width:2}.small{font-size:22px;letter-spacing:4px}.tiny{font-size:18px;letter-spacing:2px}.title{font-size:38px;font-weight:700;letter-spacing:5px}</style></defs><rect width="1200" height="1600" fill="url(#bg)"/><text x="600" y="80" text-anchor="middle" class="title">ARQUITECTURA DE CAPACIDADES DEL ORGANISMO</text><text x="600" y="120" text-anchor="middle" class="small muted">LO SUTIL → LO DENSO</text><g transform="translate(600 300)" filter="url(#glow)"><circle r="170" class="node"/><circle cx="0" cy="-90" r="42" class="node"/><circle cx="90" cy="0" r="42" class="node"/><circle cx="0" cy="90" r="42" class="node"/><circle cx="-90" cy="0" r="42" class="node"/><path d="M0-48V48M-48 0H48M-65-65L65 65M65-65L-65 65" class="line"/><text x="0" y="-185" text-anchor="middle" class="small">IDEA</text><text x="205" y="7" class="small">ORDEN</text><text x="0" y="210" text-anchor="middle" class="small">FUNCIÓN</text><text x="-305" y="7" class="small">SKILL</text><text x="0" y="285" text-anchor="middle" class="tiny muted">AQUÍ NACE LA CAPACIDAD ANTES DE EXISTIR FÍSICAMENTE</text></g><path d="M600 605V700" class="line"/><polygon points="590,690 610,690 600,710" fill="#6bb5a6"/><g transform="translate(600 820)"><rect x="-430" y="-95" width="860" height="190" rx="36" class="node"/><text x="-330" y="0" class="small">DISEÑO</text><text x="-120" y="0" class="small">ARQUITECTURA</text><text x="150" y="0" class="small">SISTEMA</text><text x="315" y="0" class="small">IMPLEMENTACIÓN</text><text x="0" y="145" text-anchor="middle" class="tiny muted">LA CAPACIDAD INVISIBLE SE TRADUCE EN ESTRUCTURA OPERATIVA</text></g><path d="M600 970V1065" class="line"/><polygon points="590,1055 610,1055 600,1075" fill="#6bb5a6"/><g transform="translate(600 1250)" filter="url(#glow)"><circle r="220" class="node"/><circle cx="0" cy="0" r="58" class="node"/><circle cx="0" cy="-135" r="55" class="node"/><circle cx="120" cy="-65" r="55" class="node"/><circle cx="120" cy="70" r="55" class="node"/><circle cx="0" cy="140" r="55" class="node"/><circle cx="-120" cy="70" r="55" class="node"/><circle cx="-120" cy="-65" r="55" class="node"/><path d="M0-58V-80M50-30L75-45M50 30L75 45M0 58V85M-50 30L-75 45M-50-30L-75-45" class="line"/><text x="0" y="-195" text-anchor="middle" class="tiny">PERCEPCIÓN</text><text x="195" y="-70" class="tiny">MEMORIA</text><text x="195" y="80" class="tiny">INTERPRETACIÓN</text><text x="0" y="215" text-anchor="middle" class="tiny">CLASIFICACIÓN</text><text x="-290" y="80" class="tiny">DECISIÓN</text><text x="-245" y="-70" class="tiny">ACCIÓN</text><text x="0" y="8" text-anchor="middle" class="tiny">APRENDIZAJE</text></g><text x="600" y="1515" text-anchor="middle" class="tiny muted">ORGANISMO × ENTORNO × OBJETIVO → EFICIENCIA → ADAPTACIÓN → FEEDBACK ↺</text></svg>